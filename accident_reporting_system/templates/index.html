```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事故通報系統</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <h1>事故通報系統</h1>

        <nav>
            <a href="{{ url_for('home') }}">首頁</a>
            <!-- 事故事件列表暫時停用 -->
        </nav>
    </header>

    <main>
        <h2>事故通報</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('report') }}"
              method="POST"
              enctype="multipart/form-data">

            <div>
                <label for="location">事故地點：</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="請輸入事故發生地點"
                    required>
            </div>

            <div>
                <label for="description">事故描述：</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="請描述事故發生的情況"
                    required></textarea>
            </div>

            <div>
                <label for="latitude">緯度（選填）：</label>
                <input
                    type="number"
                    id="latitude"
                    name="latitude"
                    step="any"
                    min="-90"
                    max="90"
                    placeholder="例如：24.1477">
            </div>

            <div>
                <label for="longitude">經度（選填）：</label>
                <input
                    type="number"
                    id="longitude"
                    name="longitude"
                    step="any"
                    min="-180"
                    max="180"
                    placeholder="例如：120.6736">
            </div>

            <div>
                <label for="image">事故照片（選填）：</label>
                <input
                    type="file"
                    id="image"
                    name="image"
                    accept=".jpg,.jpeg,.png,.webp">
            </div>

            <button type="submit">送出事故通報</button>
        </form>
    </main>
</body>
</html>
```

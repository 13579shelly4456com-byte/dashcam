
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事故資訊接收系統</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        #status {
            text-align: center;
            color: #666;
            margin: 20px 0;
        }

        #result {
            display: none;
        }

        .information {
            line-height: 2;
            margin-bottom: 20px;
        }

        .information p {
            overflow-wrap: anywhere;
        }

        img {
            display: block;
            max-width: 100%;
            max-height: 450px;
            margin: 20px auto;
            border-radius: 8px;
        }

        .map-link {
            display: inline-block;
            margin-top: 10px;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>事故資訊接收系統</h1>

    <div id="status">
        等待事故資訊傳入中...
    </div>

    <div id="result">

        <h2>事故資訊</h2>

        <div class="information">
            <p><strong>事故編號：</strong><span id="event_id"></span></p>

            <p><strong>接收時間：</strong><span id="timestamp"></span></p>

            <p><strong>事故描述：</strong><span id="description"></span></p>

            <p><strong>緯度：</strong><span id="latitude"></span></p>

            <p><strong>經度：</strong><span id="longitude"></span></p>

        </div>

        

        <h3>事故影像</h3>

        <img id="accident_image" alt="事故影像">

    </div>

</div>

<script>
    let lastEventId = null;

    async function getAccidentInformation() {

        try {
            const response = await fetch("/api/latest");
            const data = await response.json();

            if (!data.received) {
                return;
            }

            const info = data.information;

            // 避免重複更新同一筆事故資料
            if (info.event_id === lastEventId) {
                return;
            }

            lastEventId = info.event_id;

            document.getElementById("status").textContent =
                "已成功接收事故資訊";

            document.getElementById("result").style.display = "block";

            document.getElementById("event_id").textContent =
                info.event_id;

            document.getElementById("timestamp").textContent =
                info.timestamp;

            document.getElementById("description").textContent =
                info.description;

            document.getElementById("latitude").textContent =
                info.latitude;

            document.getElementById("longitude").textContent =
                info.longitude;

            // 顯示 Base64 圖片
            document.getElementById("accident_image").src =
                info.image_data;

        } catch (error) {
            console.error("取得事故資訊失敗：", error);
        }
    }

    // 每秒向 Flask 確認是否收到新資料
    setInterval(getAccidentInformation, 1000);

    getAccidentInformation();
</script>

</body>
</html>
